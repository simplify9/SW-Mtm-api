name: CI/CD Pipeline
run-name: Run-${{ github.ref_name }}-${{ github.run_number }}

on:
  push:
    branches: [main, 'releases/*']
  workflow_dispatch:

# contents: write -> tag job. packages: write -> push the image to GHCR, publish
# the Helm chart to GHCR OCI, and pull the OCI chart back for the deploy.
permissions:
  security-events: read
  contents: write
  packages: write

jobs:
  Prod:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 
      'main' || startsWith(github.ref_name, 'releases/') }}
    uses: simplify9/.github/.github/workflows/reusable-service-cicd.yml@main
    with:
      major-version: '8'
      minor-version: '0'
      dotnet-version: '8.0.x'

      # The SDK is pushed by the nuget job below (trusted publishing), not here:
      # the build and tests still run in the shared workflow.
      nuget-projects: ''
      run-tests: 'true'
      test-projects: 'SW.Mtm.UnitTests/SW.Mtm.UnitTests.csproj'

      dockerfile-path: './Dockerfile'
      docker-context: '.'

      chart-name: 'mtm'                     # must match charts/default Chart.yaml name:
      chart-path: './charts/default'
      chart-repo-url: https://charts.sf9.io

      # 1) Publish the Helm chart to GHCR OCI only (as the old pipeline did)
      chart-publish-method: 'both'

      # Image pushed to GHCR (kept as the old file had it).
      # NOTE: the chart's deployment.yaml hardcodes the image as
      # docker.io/simplify9/mtm:<chart-version> and ignores image.repository, so
      # the deploy pulls from Docker Hub — NOT this freshly built GHCR image.
      container-registry: 'ghcr.io'
      image-name: 'simplify9/mtm'

      # 2) Deploy to playground via Gateway API
      deploy: true
      # 3) Pull the chart from GHCR OCI (where we just published it)
      deploy-chart-source: 'github-oci'
      deploy-namespace: 'playground'
      routing-mode: 'gateway-api'
      gateway-hostnames: 'mtm.sf9.io'
      gateway-paths: '/api'                 # adapted from the old ingress.path
      # mtm.sf9.io IS a *.sf9.io host, so the deploy attaches it to the shared
      # wildcard listener (sectionName https-wildcard-sf9-io) rather than onboarding
      # a dedicated listener + cert — no per-host DNS/cert setup required.

      # Non-routing chart values. The app environment is read from
      # .Values.global.environment; the old file set the UNUSED top-level
      # .Values.environment, so it effectively ran as Development (kept as-is).
      # replicaCount defaults to 1. dbType selects the database provider.
      helm-set-values: |
        global.environment=Development,replicaCount=1,dbType=PgSql
        resources.requests.cpu=25m
        resources.requests.memory=176Mi
        resources.limits.memory=352Mi
    secrets:
      # Image push to GHCR uses the built-in token (registry-password); the chart
      # OCI push + pull use the built-in GITHUB_TOKEN inside the reusable.
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

      # ── Required for 'both' and 'chartmuseum' publish methods: ───────────────
      chartmuseum-username: ${{ secrets.CM_USER }}
      chartmuseum-password: ${{ secrets.CM_PASSWORD }}

      # Gateway-API cluster kubeconfig (V2)
      kubeconfig-gateway: ${{ secrets.S9DEV_KUBECONFIG_V2 }}

      # Tagging uses the job's built-in GITHUB_TOKEN (contents: write is granted
      # above). The org PAT used here before expired (HTTP 401).
      github-token: ${{ secrets.GITHUB_TOKEN }}

      # App configuration passed to helm --set-string during deploy (masked)
      helm-set-secret-values: 'db=${{ secrets.DBCS }}'
      dependabot-alerts-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}

  # The SDK goes to nuget.org with Trusted Publishing: GitHub's OIDC token is traded for an API key
  # that lasts an hour, so there is no stored key to expire (the SWNUGETKEY secret had expired).
  # nuget.org takes the workflow file from the token's job_workflow_ref and requires it to be in
  # this repository, so the login can't run inside the shared reusable-service-cicd.yml; it runs
  # here, after it, with the version it computed. The nuget.org policy: owner simplify9,
  # repository SW-Mtm-api, workflow ci-cd.yml. NUGET_USER (a repository or organisation variable) is
  # the nuget.org user who created the policy. The version is tagged by then, and a failed push
  # can be re-run on its own: --skip-duplicate makes that safe.
  nuget:
    needs: Prod
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the OIDC token NuGet/login trades for a short-lived API key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore and build
        uses: simplify9/.github/.github/actions/dotnet-build@main
        with:
          projects: 'SW.Mtm.Sdk/SW.Mtm.Sdk.csproj'
          configuration: Release
          dotnet-version: '8.0.x'
          run-tests: false
      - name: NuGet login (OIDC to a one-hour API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Pack and push
        uses: simplify9/.github/.github/actions/dotnet-pack-push@main
        with:
          projects: 'SW.Mtm.Sdk/SW.Mtm.Sdk.csproj'
          configuration: Release
          version: ${{ needs.Prod.outputs.version }}
          api-key: ${{ steps.login.outputs.NUGET_API_KEY }}
          nuget-source: 'https://api.nuget.org/v3/index.json'
